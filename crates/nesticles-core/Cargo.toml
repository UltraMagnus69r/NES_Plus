[package]
name = "nesticles-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Project model, cartridge codecs, physics, and workshop tools for Nesticles"
publish = false

[features]
default = ["png"]
png = ["dep:image"]
decode = ["dep:symphonia"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25.6", optional = true, default-features = false, features = ["png", "jpeg"] }
symphonia = { version = "0.5.5", optional = true, default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
