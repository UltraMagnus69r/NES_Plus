[package]
name = "nesticles-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nesticles browser player (wasm32)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nesticles-core = { path = "../nesticles-core", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Element",
    "HtmlElement",
    "Node",
    "EventTarget",
    "Performance",
    "ImageData",
    "console",
    "DomRect",
] }
